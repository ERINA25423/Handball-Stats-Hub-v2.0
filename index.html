<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Handball Stats Hub v2</title>

<meta name="theme-color" content="#1d4ed8">

<meta
name="apple-mobile-web-app-capable"
content="yes">

<meta
name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta
name="apple-mobile-web-app-title"
content="Handball Stats Hub">

<link
rel="manifest"
href="manifest.json">

<link
rel="apple-touch-icon"
href="icons/icon-192.png">

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<!-- =======================================
HEADER
======================================= -->

<header id="header">

<div id="titleArea">

<h1>
Handball Stats Hub
</h1>

</div>

<div id="headerRight">

<div id="halfDisplay">
1st Half
</div>

<div id="timerDisplay">
00:00
</div>

</div>

</header>

<!-- =======================================
TOP CONTROL
======================================= -->

<section id="topControls">

<div id="teamSwitcher">

<button
id="myTeamBtn"
class="active">

MY TEAM

</button>

<button
id="opponentBtn">

OPPONENT

</button>

</div>

<div id="timerControls">

<button id="minus10">

−10s

</button>

<button id="minus1">

−1s

</button>

<button id="startStop">

START

</button>

<button id="plus1">

+1s

</button>

<button id="plus10">

+10s

</button>

</div>

</section>

<!-- =======================================
MAIN
======================================= -->

<main id="mainContainer">

<!-- =======================================
LEFT PANEL
======================================= -->

<section id="leftPanel">

<div class="panel">

<h2>

POSITION

</h2>

<div id="positionList">

  <div class="positionRow">

<button class="positionButton">

PV

</button>

<input
type="number"
class="numberInput"
placeholder="#">

</div>

<div class="positionRow">

<button class="positionButton">

RW

</button>

<input
type="number"
class="numberInput"
placeholder="#">

</div>

<div class="positionRow">

<button class="positionButton">

RB

</button>

<input
type="number"
class="numberInput"
placeholder="#">

</div>

<div class="positionRow">

<button class="positionButton">

CB

</button>

<input
type="number"
class="numberInput"
placeholder="#">

</div>

<div class="positionRow">

<button class="positionButton">

LB

</button>

<input
type="number"
class="numberInput"
placeholder="#">

</div>

<div class="positionRow">

<button class="positionButton">

LW

</button>

<input
type="number"
class="numberInput"
placeholder="#">

</div>

</div>

</div>

<!-- ==========================
GK
========================== -->

<div class="panel">

<h2>

GK / EXTRA PLAYER

</h2>

<div class="gkRow">

<input
type="number"
id="gkNumber"
placeholder="#">

<input
type="text"
id="gkName"
placeholder="Player Name">

</div>

</div>

<!-- ==========================
MEMO
========================== -->

<div class="panel">

<h2>

MEMO

</h2>

<textarea

id="memo"

rows="6"

placeholder="メモを入力">

</textarea>

</div>

</section>

<!-- ==========================
CENTER PANEL
========================== -->

<section id="centerPanel">

<div class="panel">

<h2>

SHOT COURSE

</h2>

<div id="shotGrid">

<button class="course">

LT

</button>

<button class="course">

CT

</button>

<button class="course">

RT

</button>

<button class="course">

LM

</button>

<button class="course">

CM

</button>

<button class="course">

RM

</button>

<button class="course">

LB

</button>

<button class="course">

CB

</button>

<button class="course">

RB

</button>

</div>

</div>

</section>

  <!-- ==========================
RIGHT PANEL
========================== -->

<section id="rightPanel">

<div class="panel">

<h2>

SHOT TYPE

</h2>

<div id="shotTypeList">

<button class="shotType">

Normal

</button>

<button class="shotType">

Fast Break

</button>

<button class="shotType">

7m

</button>

<button class="shotType">

Wing

</button>

<button class="shotType">

Jump

</button>

<button class="shotType">

Spin

</button>

<button class="shotType">

Kempa

</button>

<button class="shotType">

Empty Goal

</button>

</div>

</div>

<div class="panel">

<h2>

RESULT

</h2>

<div id="resultList">

<button class="result goal">

GOAL

</button>

<button class="result save">

SAVED

</button>

<button class="result miss">

MISS

</button>

<button class="result block">

BLOCK

</button>

<button class="result post">

POST

</button>

<button class="result out">

OUT

</button>

<button class="result passive">

PASSIVE

</button>

<button class="result turnover">

TURNOVER

</button>

</div>

</div>

</section>

</main>

<!-- ==========================
BOTTOM MENU
========================== -->

<footer id="bottomBar">

<button id="otherButton">

OTHER

</button>

<button id="historyButton">

HISTORY

</button>

<button id="undoButton">

UNDO

</button>

<button id="changeHalfButton">

CHANGE HALF

</button>

<button id="saveEventButton">

SAVE EVENT

</button>

<button id="finishMatchButton">

END & SAVE MATCH

</button>

</footer>

<!-- ==========================
HISTORY PANEL
========================== -->

<section id="historyPanel" class="hidden">

<h2>

MATCH HISTORY

</h2>

<div id="myHistory">

<h3>

MY TEAM

</h3>

<div id="myHistoryList">

</div>

</div>

<div id="opponentHistory">

<h3>

OPPONENT

</h3>

<div id="opponentHistoryList">

</div>

</div>

</section>
